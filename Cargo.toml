[package]
name = "telemetry"
description = "One-call OpenTelemetry setup."
authors = ["Musa Mahmoud Jingo <dev.musajingo@pm.me>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/musajingo/telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
self_named_module_files = "deny"

[features]
default       = ["otlp-grpc", "tower-http", "json"]
# Requires a Tokio runtime.
otlp-grpc     = ["dep:opentelemetry-otlp", "opentelemetry-otlp/grpc-tonic", "dep:tokio"]
# Runs on exporter threads; no async runtime needed.
otlp-http     = ["dep:opentelemetry-otlp", "opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-blocking-client"]
otlp-grpc-tls = ["otlp-grpc", "opentelemetry-otlp/tls", "opentelemetry-otlp/tls-roots"]
otlp-http-tls = ["otlp-http", "opentelemetry-otlp/reqwest-rustls"]
tower-http    = ["dep:tower-http", "dep:http", "dep:opentelemetry-http"]
json          = ["dep:json-subscriber"]
stdout        = ["dep:opentelemetry-stdout"]

[dependencies]
tracing                            = "0.1.41"
tracing-subscriber                 = { version = "0.3.22", default-features = false, features = ["std", "registry", "fmt", "env-filter", "ansi"] }
tracing-opentelemetry              = { version = "0.33", features = ["metrics"] }
opentelemetry                      = "0.32"
opentelemetry_sdk                  = { version = "0.32", features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing     = "0.32"
opentelemetry-otlp                 = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "internal-logs"], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
opentelemetry-stdout               = { version = "0.32", features = ["trace", "metrics"], optional = true }
opentelemetry-http                 = { version = "0.32", optional = true }
# Must match the application's tower-http version so the traits are compatible.
tower-http                         = { version = "0.6", features = ["trace"], optional = true }
http                               = { version = "1", optional = true }
# Checks for a runtime so init returns an error instead of tonic panicking.
tokio                              = { version = "1.42", default-features = false, features = ["rt"], optional = true }
# Match tracing-opentelemetry's version to read trace IDs from spans.
json-subscriber                    = { version = "0.3.1", features = ["tracing-opentelemetry-0-33"], optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
